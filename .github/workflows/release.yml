name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  images:
    name: Publish images
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Required to push to GitHub Container Registry.
      packages: write

    strategy:
      matrix:
        binary: [transaction-api, outbox-relay, migrate]

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.binary }}
          # No `latest`: a rollback needs a reference that cannot move, and the
          # Terraform rejects it as an image_tag for the same reason.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          # Both architectures: ARM64 is what the ECS tasks run, AMD64 keeps the
          # images usable on a developer laptop and in other runners.
          platforms: linux/amd64,linux/arm64
          build-args: |
            BINARY=${{ matrix.binary }}
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
