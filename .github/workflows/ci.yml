name: CI

on:
  push:
    branches: [main, develop, "feature/**", "release/**", "hotfix/**"]
  pull_request:
    branches: [main, develop]

# Least privilege by default; jobs opt in to more where they need it.
permissions:
  contents: read

# A new push to the same branch supersedes the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned to match the Makefile so local and CI lint results never disagree.
  GOLANGCI_LINT_VERSION: v2.12.2

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          # go.mod is the single source of truth for the toolchain version, so
          # a Go security patch is applied by bumping one line and CI proves it.
          go-version-file: go.mod
          cache: true

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum \
            || { echo "::error::go.mod/go.sum are not tidy — run 'make tidy' and commit the result"; exit 1; }

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }}

      - name: Lint
        run: golangci-lint run ./...

  contract:
    name: Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          # go.mod is the single source of truth for the toolchain version, so
          # a Go security patch is applied by bumping one line and CI proves it.
          go-version-file: go.mod
          cache: true

      # The OpenAPI document is the source of truth. If the committed generated
      # code no longer matches it, the running service and the published
      # contract have diverged — which is the failure mode ADR-0002 exists to
      # prevent. oapi-codegen is pinned as a Go tool dependency in go.mod, so
      # there is nothing extra to install.
      - name: Verify generated code matches the spec
        run: make generate-check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          # go.mod is the single source of truth for the toolchain version, so
          # a Go security patch is applied by bumping one line and CI proves it.
          go-version-file: go.mod
          cache: true

      - name: Test with race detector and coverage
        run: make cover

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # `git describe` needs history to derive the version stamp.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          # go.mod is the single source of truth for the toolchain version, so
          # a Go security patch is applied by bumping one line and CI proves it.
          go-version-file: go.mod
          cache: true

      - name: Build binaries
        run: make build

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          # go.mod is the single source of truth for the toolchain version, so
          # a Go security patch is applied by bumping one line and CI proves it.
          go-version-file: go.mod
          cache: true

      - name: Check dependencies for known vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Scan history for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
