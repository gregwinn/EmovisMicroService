version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Dependency updates target the integration branch, never production.
    target-branch: develop
    commit-message:
      prefix: "chore(deps)"
    groups:
      # One PR for routine patch bumps; majors and minors stay separate so they
      # get read properly.
      patch-updates:
        update-types:
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: develop
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: docker
    directory: /deploy/docker
    schedule:
      interval: weekly
    target-branch: develop
    commit-message:
      prefix: "chore(docker)"
